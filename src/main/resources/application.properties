# Server Port (Binds to PORT env variable assigned by Cloud Provider, defaults to 8085)
server.port=${PORT:8085}

# Application Name
spring.application.name=Pune Bazar WhatsApp Calculator & Ledger System

# Database Configuration (Persistent File DB on VPS NVMe SSD for 100% Guaranteed Daily Persistence)
spring.datasource.url=jdbc:h2:file:/opt/punabazar/data/punabazardb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}


