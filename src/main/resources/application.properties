# Server Port (Binds to PORT env variable assigned by Cloud Provider, defaults to 8085)
server.port=${PORT:8085}

# Application Name
spring.application.name=Pune Bazar WhatsApp Calculator & Ledger System

# Database Configuration (Embedded In-Memory H2 DB with DB_CLOSE_DELAY=-1)
spring.datasource.url=jdbc:h2:mem:punabazar;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}


