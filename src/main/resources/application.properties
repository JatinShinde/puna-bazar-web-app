# Server Port (Binds to PORT env variable assigned by Cloud Provider, defaults to 8085)
server.port=${PORT:8085}

# Application Name
spring.application.name=Pune Bazar WhatsApp Calculator & Ledger System

# Database Configuration (Aiven Cloud MySQL Database via Cloud Env Vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-22a10626-jatinsshinde1885-cfb2.f.aivencloud.com:14510/defaultdb?sslMode=REQUIRED&useSSL=true&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=false

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}


