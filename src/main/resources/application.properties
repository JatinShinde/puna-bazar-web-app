# Server Port (Binds to PORT env variable assigned by Cloud Provider, defaults to 8080)
server.port=${PORT:8080}

# Application Name
spring.application.name=Pune Bazar WhatsApp Calculator & Ledger System

# Database Configuration (Defaults to persistent file H2 DB in ./data directory; overridden by cloud env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/punabazardb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

