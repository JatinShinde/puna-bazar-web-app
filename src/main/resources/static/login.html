<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator - Universal Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #0f172a 100%);
            margin: 0;
            padding: 1rem;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            border-radius: 1.5rem;
            padding: 2.25rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            color: #f8fafc;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .brand-icon {
            font-size: 2.75rem;
            margin-bottom: 0.25rem;
            display: inline-block;
        }
        .brand-title {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(to right, #34d399, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .brand-sub {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .alert-box {
            padding: 0.85rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            text-align: center;
            line-height: 1.4;
            display: none;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1.5px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }
        .alert-warning {
            background: rgba(245, 158, 11, 0.15);
            border: 1.5px solid rgba(245, 158, 11, 0.35);
            color: #fde047;
        }
        .alert-info {
            background: rgba(56, 189, 248, 0.15);
            border: 1.5px solid rgba(56, 189, 248, 0.35);
            color: #7dd3fc;
        }
        .form-group {
            margin-bottom: 1.15rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 0.75rem;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 0.75rem;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.4);
        }
        .hours-badge {
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.75rem;
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">🧾</div>
            <h1 class="brand-title">RECEIPT GENERATOR</h1>
            <p class="brand-sub">Daily Calculation & Access System</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <!-- UNIVERSAL SINGLE LOGIN FORM -->
        <form id="universalLoginForm" onsubmit="handleUniversalLogin(event)">
            <div class="form-group">
                <label for="userName">Full Name *</label>
                <input type="text" id="userName" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="userPhone">Mobile Number *</label>
                <input type="tel" id="userPhone" class="form-control" placeholder="e.g. 9876543210" required>
            </div>

            <div class="form-group">
                <label for="userPassword">Access Password *</label>
                <input type="password" id="userPassword" class="form-control" placeholder="Enter access password" required>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">🚀 Open Market View</button>
        </form>

        <div class="hours-badge" id="operatingHoursBadge">
            ⏰ Allowed Operating Hours: <strong style="color: #38bdf8;" id="hoursRangeText">Loading...</strong>
        </div>
    </div>

    <script>
        async function fetchSettings() {
            try {
                const res = await fetch('/api/user-access/settings');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('hoursRangeText').textContent = `${data.startTime || '00:00'} to ${data.endTime || '18:00'}`;
                }
            } catch (err) {
                document.getElementById('hoursRangeText').textContent = '12:00 AM to 06:00 PM';
            }
        }

        function showAlert(msg, type = 'error') {
            const box = document.getElementById('alertBox');
            box.className = `alert-box alert-${type}`;
            box.innerHTML = msg;
            box.style.display = 'block';
        }

        async function handleUniversalLogin(e) {
            e.preventDefault();
            document.getElementById('alertBox').style.display = 'none';
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = 'Verifying Access... ⏳';

            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const password = document.getElementById('userPassword').value.trim();

            try {
                const res = await fetch('/api/user-access/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, password })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.role === 'ADMIN') {
                        localStorage.setItem('pb_user_name', name || 'Admin');
                        localStorage.setItem('pb_user_role', 'ADMIN');
                    } else {
                        localStorage.setItem('pb_user_phone', phone);
                        localStorage.setItem('pb_user_name', name);
                        localStorage.setItem('pb_user_role', 'USER');
                    }
                    window.location.href = '/index.html';
                } else {
                    if (data.status === 'PENDING') {
                        showAlert('⏳ <strong>Access Request Submitted!</strong><br>Your account is waiting for One-Time Admin Approval. Please notify Admin.', 'warning');
                    } else if (data.status === 'PAUSED') {
                        showAlert('⏸️ <strong>Access Paused!</strong><br>Your account is currently paused by Admin. Contact Admin to resume access.', 'warning');
                    } else if (data.status === 'OUTSIDE_WINDOW') {
                        showAlert(`⏰ <strong>Market Closed!</strong><br>${data.error}`, 'info');
                    } else {
                        showAlert(`⚠️ ${data.error || 'Login Failed'}`, 'error');
                    }
                }
            } catch (err) {
                showAlert('⚠️ Connection error. Please check server connection.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 Open Market View';
            }
        }

        fetchSettings();
    </script>
</body>
</html>
